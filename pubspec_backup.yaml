name: erp
description: "ERP System - Sales, Purchases, Inventory, Reports, Invoices, and Accounts"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^2.0.1
  badges: ^3.1.2
  flutter_html: ^3.0.0-alpha.3
  flutter_screenutil: ^5.9.3
  hugeicons: ^1.1.0
  freerasp: ^7.5.0

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  auto_route: ^11.1.0

  # Networking
  connectivity_plus: ^7.1.0

  # Storage
  shared_preferences: ^2.5.3

  # Localization
  easy_localization: ^3.0.7

  # Utils
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  logger: ^2.5.0
  http: ^1.6.0
  flutter_native_splash: ^2.4.0
  excel: ^4.0.6
  syncfusion_flutter_charts: ^33.1.47
  syncfusion_flutter_pdf: ^33.1.47
  arabic_reshaper: ^0.0.1
  bidi: ^2.0.13
  image_picker: ^1.2.2
  qr_flutter: ^4.1.0

  # Map
  flutter_map: ^8.1.1
  latlong2: ^0.9.0
  geolocator: ^14.0.0
  geocoding: ^4.0.0

  # Firebase & Social Login
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.6
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  auto_route_generator: ^10.0.1
  riverpod_generator: ^4.0.0+1
  easy_localization_generator: ^0.3.5
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/common/icons/
    - assets/common/images/
    - assets/common/fonts/
    - assets/common/translations/
    - assets/webstore/icons/
    - assets/webstore/images/
    - assets/webstore/fonts/
    - assets/webstore/data_webstore.json
    - assets/config/
  fonts:
    - family: store
      fonts:
        - asset: assets/webstore/fonts/store-Regular.otf